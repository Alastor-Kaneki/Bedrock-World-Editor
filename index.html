<!doctype html>
<html lang="en" data-app-state="loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a08">
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="Bedrock Workshop">
  <meta name="description" content="Privately edit Minecraft Bedrock worlds, inventories, containers, and NBT in your browser. Files never leave your device.">
  <meta property="og:title" content="Bedrock Workshop">
  <meta property="og:description" content="A local-first Minecraft Bedrock world editor. No uploads, accounts, or servers.">
  <title>Bedrock Workshop | Private world editor</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070a08;color:#f4f7f2;font-family:Inter,system-ui,sans-serif}
    .boot-shell{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 30%,#152519,#070a08 52%)}
    .boot-card{width:min(520px,100%);padding:34px;border:1px solid #304036;border-radius:10px;background:#0c120e;box-shadow:0 28px 90px #000}
    .boot-mark{width:48px;height:48px;display:grid;place-items:center;border-radius:7px;background:linear-gradient(145deg,#b7f67b,#4fba61);color:#071006;font-weight:900;box-shadow:inset -5px -5px #0002}
    .boot-card p{margin:22px 0 8px;color:#91e451;font:800 11px/1 ui-monospace,monospace;letter-spacing:.13em}.boot-card h1{margin:0;font-size:clamp(32px,8vw,54px);letter-spacing:-.055em}.boot-line{height:3px;margin-top:26px;overflow:hidden;background:#1d2921}.boot-line::after{content:"";display:block;width:38%;height:100%;background:#91e451;animation:boot 1.2s ease-in-out infinite alternate}@keyframes boot{to{transform:translateX(165%)}}
  </style>
</head>
<body>
  <main id="bootStatus" class="boot-shell" aria-live="polite">
    <div class="boot-card">
      <div class="boot-mark" aria-hidden="true">B</div>
      <p>BEDROCK WORKSHOP / v0.6.1</p>
      <h1>Preparing your local workspace.</h1>
      <div class="boot-line" aria-hidden="true"></div>
    </div>
  </main>
  <noscript>Bedrock Workshop requires JavaScript to read and rebuild worlds locally in your browser.</noscript>
  <script type="module" src="./ui-0.6.1.js?v=0.6.1"></script>
</body>
</html>
