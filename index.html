<!doctype html>
<html lang="en" data-app-state="loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08050b">
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="Bedrock Workshop">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Privately edit Minecraft Bedrock worlds, inventories, containers, and NBT in your browser. Files never leave your device.">
  <meta property="og:title" content="Bedrock Workshop">
  <meta property="og:description" content="A local-first Minecraft Bedrock world editor. No uploads, accounts, or servers.">
  <meta property="og:type" content="website">
  <title>Bedrock Workshop | Private world editor</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./workshop-features.css?v=0.6.1-feature-pack-1">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#050406;color:#f8f3fb;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot-shell{
      min-height:100vh;display:grid;place-items:center;padding:28px;
      background:
        radial-gradient(circle at 20% 18%,rgba(255,59,100,.17),transparent 34rem),
        radial-gradient(circle at 84% 22%,rgba(169,0,255,.18),transparent 38rem),
        #050406
    }
    .boot-card{
      width:min(560px,100%);padding:36px;border:1px solid #49344f;border-radius:14px;
      background:linear-gradient(180deg,#100b13,#0a070c);box-shadow:0 30px 110px rgba(0,0,0,.62)
    }
    .boot-top{display:flex;align-items:center;gap:14px}
    .boot-mark{
      width:50px;height:50px;display:grid;place-items:center;border-radius:10px;
      background:linear-gradient(135deg,#ff4e73 0 48%,#a900ff 52% 100%);
      color:#fff;font-weight:900;box-shadow:inset -5px -5px rgba(0,0,0,.16),0 14px 34px rgba(169,0,255,.24)
    }
    .boot-kicker{margin:0;color:#d99cff;font:800 11px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.13em}
    .boot-card h1{margin:22px 0 10px;font-size:clamp(34px,8vw,58px);line-height:.94;letter-spacing:-.06em}
    .boot-card .boot-copy{margin:0;color:#b9acbf;font-size:14px;line-height:1.6}
    .boot-line{height:3px;margin-top:28px;overflow:hidden;border-radius:999px;background:#231829}
    .boot-line::after{
      content:"";display:block;width:42%;height:100%;border-radius:999px;
      background:linear-gradient(90deg,#ff4e73,#d52bc2,#a900ff);
      animation:boot 1.1s ease-in-out infinite alternate
    }
    @keyframes boot{to{transform:translateX(145%)}}
    @media(prefers-reduced-motion:reduce){.boot-line::after{animation:none;width:100%}}
  </style>
</head>
<body>
  <main id="bootStatus" class="boot-shell" aria-live="polite">
    <div class="boot-card">
      <div class="boot-top">
        <div class="boot-mark" aria-hidden="true">B</div>
        <p class="boot-kicker">BEDROCK WORKSHOP / v0.6.1</p>
      </div>
      <h1>Preparing your local workspace.</h1>
      <p class="boot-copy">Loading the editor, Bedrock data helpers, and offline workspace entirely in your browser.</p>
      <div class="boot-line" aria-hidden="true"></div>
    </div>
  </main>
  <noscript>Bedrock Workshop requires JavaScript to read and rebuild worlds locally in your browser.</noscript>
  <script type="module" src="./ui-0.6.1.js?v=0.6.1"></script>
  <script type="module" src="./workshop-features.js?v=0.6.1-feature-pack-1"></script>
</body>
</html>
